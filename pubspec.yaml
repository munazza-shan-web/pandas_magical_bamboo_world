name: pandas_magical_bamboo_world
description: A cozy interactive 2D panda play world built with Flutter.
publish_to: "none"
version: 2.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - legal/

flutter_launcher_icons:
  android: true
  image_path: "assets/branding/panda_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/panda_icon.png"
    background_color: "#173D31"
    theme_color: "#173D31"
  windows:
    generate: true
    image_path: "assets/branding/panda_icon.png"
